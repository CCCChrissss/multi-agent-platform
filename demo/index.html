<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Agent 平台 Demo（本機）</title>
<style>
  :root {
    color-scheme: light;

    --ground: #EDECEF;
    --surface: #FFFFFF;
    --surface-2: #F4F3F8;
    --line: #D6D4E0;
    --line-soft: #E5E3EC;
    --ink: #16151E;
    --ink-2: #2F2D3B;
    --ink-3: #4A4757;
    --muted: #8F8BA0;
    --accent: #3F43A0;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(63, 67, 160, 0.10);
    --run: #8F5E12;
    --run-soft: rgba(143, 94, 18, 0.13);
    --ok: #24684A;
    --ok-soft: rgba(36, 104, 74, 0.13);
    --bad: #9C3728;
    --bad-soft: rgba(156, 55, 40, 0.13);
    --canvas: #E9E8EE;
    --canvas-dot: #C7C5D4;
    --shadow: 0 1px 2px rgba(25, 24, 35, 0.06), 0 8px 24px rgba(25, 24, 35, 0.07);

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

    --console-h: 240px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  ::placeholder { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .mono { font-family: var(--mono); }

  .app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  .topbar {
    display: flex; align-items: center; gap: 18px; padding: 10px 16px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 6px; border: 1px dashed var(--line); border-radius: 3px; color: var(--ink-3); white-space: nowrap;
  }
  .field { display: flex; align-items: center; gap: 7px; }
  .field > label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
  select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 8px; font-family: var(--mono); font-size: 12px; color: var(--ink); max-width: 280px;
  }
  .spacer { flex: 1 1 auto; }
  .run-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 5px; padding: 7px 16px; font-family: var(--mono);
    font-size: 12px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer;
  }
  .run-btn:hover { filter: brightness(1.1); }
  .run-btn[disabled] { opacity: 0.45; cursor: default; filter: none; }
  .ghost-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 12px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ghost-btn[disabled] { opacity: 0.45; cursor: default; }
  .ghost-btn[disabled]:hover { border-color: var(--line); color: var(--ink-2); }
  .runmeta { font-family: var(--mono); font-size: 11px; color: var(--ink-2); display: flex; gap: 14px; align-items: center; }
  .runmeta b { color: var(--ink); font-weight: 600; }

  .body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .left { display: grid; grid-template-rows: minmax(0, 1fr) 7px var(--console-h); min-width: 0; }

  .split { position: relative; background: transparent; }
  .split::after { content: ""; position: absolute; background: var(--line); transition: background 0.12s; }
  .split-h { cursor: row-resize; }
  .split-h::after { left: 0; right: 0; top: 3px; height: 1px; }
  .split:hover::after, .split.dragging::after { background: var(--accent); }

  /* ---------- 畫布 ---------- */
  .canvas {
    position: relative; overflow: hidden; background-color: var(--canvas);
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
    background-size: 22px 22px; touch-action: none; cursor: grab;
  }
  .canvas.panning { cursor: grabbing; }
  #viewport { position: absolute; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0; }
  .wires { position: absolute; top: 0; left: 0; width: 2600px; height: 1600px; pointer-events: none; overflow: visible; }
  .wire { fill: none; stroke: var(--line); stroke-width: 1.75; }
  .wire.hot { stroke: var(--run); stroke-dasharray: 5 4; animation: flow 0.7s linear infinite; }
  .wire.done { stroke: var(--ok); }
  @keyframes flow { to { stroke-dashoffset: -18px; } }

  .edge-label {
    position: absolute; transform-origin: 0 0; cursor: pointer; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    box-shadow: var(--shadow);
  }
  .edge-label:hover { border-color: var(--accent); color: var(--accent); }
  .edge-label.none { border-style: dashed; color: var(--bad); }

  .zoombar {
    position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px; box-shadow: var(--shadow);
  }
  .zoombar button {
    background: none; border: none; cursor: pointer; font-family: var(--mono);
    font-size: 12px; color: var(--ink-2); padding: 3px 8px; border-radius: 4px; line-height: 1.4;
  }
  .zoombar button:hover { background: var(--surface-2); color: var(--ink); }
  .zoombar .lvl { font-family: var(--mono); font-size: 11px; color: var(--ink-2); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .canvas-hint { position: absolute; left: 14px; bottom: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .canvas-empty {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;
    color: var(--ink-3); font-family: var(--mono); font-size: 12.5px; line-height: 1.8; pointer-events: none; max-width: 380px;
  }

  .node {
    position: absolute; width: 188px; background: var(--surface);
    border: 1px solid var(--line); border-left: 3px solid var(--ink-3);
    border-radius: 7px; box-shadow: var(--shadow); cursor: grab; user-select: none; padding: 10px 12px 11px;
  }
  .node:active { cursor: grabbing; }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
  .node.running { border-left-color: var(--run); }
  .node.done { border-left-color: var(--ok); }
  .node.bad { border-left-color: var(--bad); }
  .node-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .node-name { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .node-desc { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .node.running .dot { background: var(--run); animation: pulse 1s ease-in-out infinite; }
  .node.done .dot { background: var(--ok); }
  .node.bad .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .chip {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em; padding: 2px 6px;
    border-radius: 3px; background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-soft); white-space: nowrap;
  }
  .chip.edited { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }

  /* ---------- Agent 設定：置中彈窗 ---------- */
  .inspector { display: none; }
  .inspector.open {
    display: flex; align-items: center; justify-content: center;
    position: fixed; inset: 0; z-index: 50; padding: 24px;
  }
  .insp-backdrop { position: absolute; inset: 0; background: rgba(22, 21, 30, 0.45); }
  .insp-modal {
    position: relative; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow);
    width: min(1440px, 96vw); height: min(900px, 92vh); display: flex; flex-direction: column; overflow: hidden;
  }
  .insp-modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex: none; }
  .insp-modal-head h2 { margin: 0; font-family: var(--mono); font-size: 16px; letter-spacing: 0.02em; }
  .insp-close {
    background: none; border: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-3);
    padding: 4px 8px; border-radius: 4px; flex: none;
  }
  .insp-close:hover { background: var(--surface-2); color: var(--ink); }
  .insp-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.2fr 1fr; }
  .insp-col { overflow-y: auto; padding: 14px 16px 24px; min-width: 0; }
  .insp-col + .insp-col { border-left: 1px solid var(--line); }
  .insp-col-title {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 12px;
  }

  /* 中間欄：Agent 零件改成分頁——蓋掉 .tabs 原本給主控台用的 padding/底線 */
  .tabs.mid-tabs { padding: 0 0 10px; border-bottom: none; }
  .mid-body { margin-top: 4px; }
  .desc-edit {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 6px 9px; font-size: 12.5px; color: var(--ink);
  }
  .desc-edit:hover { border-color: var(--line); }

  .sect-title {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .sect-title:first-child { margin-top: 0; }
  .hint { font-size: 11.5px; color: var(--ink-3); margin: 7px 0 0; }

  /* 來源對應（唯讀） */
  .maprow { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 8px 9px; margin-bottom: 7px; }
  .srow-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .sname { font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-weight: 600; }
  .stype { font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 3px; padding: 1px 5px; }
  .sreq { font-family: var(--mono); font-size: 9.5px; color: var(--bad); }
  .slabel { margin-left: auto; font-size: 11px; color: var(--ink-3); }

  .mapline { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .mapline > .lbl { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); flex: none; }
  .resolved {
    margin-top: 6px; padding: 5px 8px; background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 5px; font-size: 12px; color: var(--ink); display: flex; gap: 7px; align-items: baseline;
  }
  .resolved .ar { color: var(--ok); font-family: var(--mono); flex: none; }
  .resolved.sample-only { color: var(--muted); }
  .resolved .val { min-width: 0; word-break: break-word; }

  /* prompt 模板 */
  .prompt-box {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px 6px 0 0;
    padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    color: var(--ink); resize: vertical; min-height: 72px; display: block;
  }
  .prompt-preview {
    background: var(--surface-2); border: 1px solid var(--line); border-top: none; border-radius: 0 0 6px 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  .prompt-preview b { color: var(--ink); font-weight: 600; }

  .io-block { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 9px 10px; }
  .io-block > .k {
    display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; font-weight: 600;
  }
  .io-block.bad > .k { color: var(--bad); }
  .schema { display: grid; gap: 5px; }
  .srow { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 5px; padding: 6px 8px; }
  .sample {
    display: block; margin-top: 4px; padding: 4px 7px; background: var(--surface-2); border-radius: 4px;
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  .sval { margin-top: 5px; }

  .fields { display: grid; gap: 7px; }
  .frow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .frow > .fk { font-size: 11.5px; color: var(--ink-3); }
  .frow > .fv { font-size: 12.5px; color: var(--ink); min-width: 0; word-break: break-word; }
  .frow > .fv .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
  .pill { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 3px; letter-spacing: 0.03em; }
  .pill.yes { background: var(--bad-soft); color: var(--bad); }
  .pill.no { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft); }
  .tagchip {
    display: inline-block; font-family: var(--mono); font-size: 10.5px; background: var(--accent-soft);
    color: var(--accent); border-radius: 3px; padding: 1px 7px; margin: 0 4px 4px 0;
  }
  .longtext { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 5px; padding: 7px 9px; font-size: 12.5px; line-height: 1.65; color: var(--ink); }

  .origin { font-family: var(--mono); font-size: 9.5px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .origin.tool { background: var(--ok-soft); color: var(--ok); }

  /* 單點測試 */
  .test { border: 1px solid var(--line-soft); border-radius: 7px; padding: 11px; background: var(--surface-2); }
  .test label.tl { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin: 9px 0 4px; }
  .test label.tl:first-of-type { margin-top: 0; }
  .test textarea, .test select, .test input[type="text"] {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink);
    resize: vertical; min-height: 34px; max-width: none;
  }
  .test .boolrow { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; }
  .test .boolrow input { accent-color: var(--accent); }
  .test-actions { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .test-out { margin-top: 11px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 6px; padding: 9px 10px; }
  .test-out .th { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); margin-bottom: 8px; }
  .test-log table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10.5px; }
  .test-log td { padding: 4px 6px; border-bottom: 1px solid var(--line-soft); color: var(--ink); vertical-align: top; }

  /* 新增 Agent 表單：欄位一列 */
  .field-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .field-row input[type="text"] { width: auto; flex: 1 1 auto; }
  .field-row select { width: auto; flex: 0 0 116px; }
  .field-row .check { flex: 0 0 auto; padding: 0; }
  .field-row .fr-remove { flex: 0 0 auto; padding: 4px 9px; }

  /* 錯誤 banner——取代 alert()，理由見上面 window.addEventListener("error", ...) 的註解 */
  .err-banner {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 999;
    max-width: 640px; width: calc(100% - 28px); background: var(--bad-soft); border: 1px solid var(--bad);
    border-radius: 7px; padding: 10px 12px; box-shadow: var(--shadow);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .err-banner pre { margin: 0; flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 11.5px; color: var(--bad); }
  .err-banner button { background: none; border: none; color: var(--bad); cursor: pointer; font-size: 15px; line-height: 1; flex: none; padding: 0; }
  .test-log tr:last-child td { border-bottom: none; }

  /* 零件 */
  .slot {
    background: var(--surface-2); border: 1px solid var(--line-soft); border-left: 3px solid var(--line);
    border-radius: 6px; padding: 10px 11px 11px; margin-bottom: 9px;
  }
  .slot:last-child { margin-bottom: 0; }
  .slot.changed { border-left-color: var(--accent); }
  .slot-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .slot-name { font-size: 12.5px; font-weight: 600; }
  .slot-role { font-size: 11.5px; color: var(--ink-3); }
  .slot-flag {
    margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em;
    color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 1px 5px;
  }
  .slot select { width: 100%; max-width: none; }

  .switch {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 5px; cursor: pointer;
  }
  .switch span { font-size: 12.5px; }
  .toggle { width: 34px; height: 19px; border-radius: 10px; background: var(--ink-3); position: relative; flex: none; transition: background 0.15s; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
  .switch.on .toggle { background: var(--accent); }
  .switch.on .toggle::after { transform: translateX(15px); }

  .srv { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 5px; margin-bottom: 7px; overflow: hidden; }
  .srv:last-child { margin-bottom: 0; }
  .srv-head { display: flex; align-items: center; gap: 8px; padding: 7px 9px; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  .srv-head input { accent-color: var(--accent); margin: 0; }
  .srv-name { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
  .srv-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
  .srv-tools { padding: 3px 9px 6px 27px; }
  .check { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; font-family: var(--mono); font-size: 11px; }
  .check input { accent-color: var(--accent); }
  /* 長期記憶瀏覽 */
  .subtabs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .subtab {
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 999px;
    padding: 3px 11px; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  }
  .subtab.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .mem { margin-top: 4px; }
  .mem-here {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-2);
    border: 1px solid var(--line-soft); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px;
  }
  .mem-here .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
  .mem-here .path { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  .mem-here .up {
    margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 9px; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  }
  .mem-here .up:hover { border-color: var(--accent); color: var(--accent); }
  .mem-group { margin-bottom: 12px; }
  .mem-group > h4 {
    margin: 0 0 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px;
  }
  .mem-group > h4::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .children { border-left: 2px solid var(--accent-soft); padding-left: 9px; display: grid; gap: 5px; }
  .child {
    display: flex; align-items: baseline; gap: 9px; cursor: pointer; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 6px; padding: 7px 9px;
  }
  .child:hover { border-color: var(--accent); background: var(--accent-soft); }
  .child .arrow { color: var(--accent); font-family: var(--mono); }
  .child .seg { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }

    color: var(--ink-2); padding: 7px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface);
  }

  table.log tr.row { cursor: pointer; }
  table.log tr.row:hover td { background: var(--surface-2); }

  .num { text-align: right; font-variant-numeric: tabular-nums; }

    font-size: 10px; letter-spacing: 0.05em; background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--ink-2);
  }
  .kind.llm { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
  .kind.memory { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft); }
  .flag { color: var(--bad); font-size: 10px; letter-spacing: 0.05em; }
  .st-pill { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .st-pill.completed { background: var(--ok-soft); color: var(--ok); }
  .st-pill.needs_review { background: var(--bad-soft); color: var(--bad); }
  .st-pill.failed { background: var(--bad-soft); color: var(--bad); }

  .detail pre { margin: 0; padding: 8px 0 4px; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
  .detail details + details { margin-top: 4px; }

</style>

<body>

<div class="app">

    <div class="field">

  <div class="body" id="bodyGrid">
    <div class="left">

        <div class="canvas-empty" id="canvasEmpty"></div>

          <button class="tab on" data-pane="log">Call Log <span class="count" id="logcount"></span></button>

    <aside class="inspector" id="inspector"></aside>
    <aside class="inspector" id="create-modal"></aside>
    <aside class="inspector" id="review-modal"></aside>
  </div>

<script>
"use strict";

// 本機 demo 工具，沒有錯誤上報機制——沒接住的例外原本只會靜靜印在
// DevTools console，畫面看起來像什麼都沒發生。攔下來至少讓使用者知道
// 「壞了」跟壞在哪一行，不用開 devtools 才發現。用畫面上的 banner 取代
// alert()——連續跳好幾次 alert() 之後 Chrome 會跳出「封鎖這個網頁繼續
// 顯示對話方塊」，之後同一頁的 alert 會被瀏覽器整個吃掉、畫面上什麼都看
// 不到，這正是這幾輪一直在追的「沒有跳 alert」的頭號嫌疑犯。
function showError(msg) {
  console.error(msg);
  let el = document.getElementById("err-banner");
  if (!el) {
    el = document.createElement("div");
    el.id = "err-banner";
    el.className = "err-banner";
    document.body.appendChild(el);
  }
  el.innerHTML = `<pre></pre><button title="關閉">×</button>`;
  el.querySelector("pre").textContent = msg;
  el.querySelector("button").addEventListener("click", () => el.remove());
}
window.addEventListener("error", e => {
  showError((e.error ? e.error.message : e.message) + ` (${e.filename}:${e.lineno})`);
});

const API = "http://localhost:8010";
const NODE_W = 188, NODE_H = 62;
const TERMINAL_STATUSES = ["completed", "needs_review", "failed"];

const LABELS = {
  audio_ref: "音檔", transcript: "逐字稿", involves_exclusion: "涉及除外責任",
  matched_articles: "命中條款", reason: "判斷理由", should_notify: "是否通知",
  subject: "通知主旨", body: "通知內容", notified_log: "送出紀錄",
  mentions_tsmc: "提及台積電", review_reason: "待複核原因", expression: "算式", result: "結果",
};

// 畫布上真正的節點清單——由 loadWorkflow() 從後端 GET /workflow/{name} 建立。
const nodes = [];

/* ================= 狀態 ================= */

const state = {
  selected: null, // 有值＝Agent 設定彈窗開著、開的是哪個節點；null＝彈窗關閉
  catalog: { models: [], tools: {} }, // GET /catalog
  samples: [], // GET /samples
  workflowList: [], // GET /workflows（workflow 跟 agent 都有，populateWorkflowSelect() 分組顯示）
  currentWorkflow: "", currentWorkflowKind: "",
  audio: "",
  running: false, poller: null, pollCount: 0, timedOut: false,
  liveThreadId: null, // 這個瀏覽器分頁最近一次按「執行」拿到的 thread_id
  viewId: null, // 目前主控台/節點著色在看哪個 thread_id 的資料；null＝還沒執行過
  snapshots: {}, // threadId -> GET /run/{thread_id} 的原始回應（一次抓到就整包快取）
  history: [], // [{threadId, when, workflow, audio}]——只記這個分頁本次開啟後跑過的，重新整理會清空（後端沒有「列出所有執行」的 API）
  expanded: new Set(),
  openResults: new Set(),
  midTab: "prompt",
  testInput: {}, testOut: {}, testing: null,
  creating: null, // 有值＝「新增 Agent」表單開著（草稿內容），null＝關閉
  schemaEdit: {}, // n.id -> {inputFields[], outputFields[]}——獨立 agent 的 schema 編輯緩衝區，lazy init，見 ensureSchemaEdit()
  memNode: null, memTab: "semantic", memPath: "", // 長期記憶分頁目前開著哪個 agent/子分頁/瀏覽路徑
  memCache: {}, // "<n.id>|<kind>|<path>" -> GET /agent/{name}/memory/... 的回應，見 loadMemory()
  pendingCounts: {}, // n.id -> {episodic:[...], procedural:[...]}（GET /memory/pending 兩個 kind 的結果），見 loadPendingCounts()
  episodicByKey: {}, // n.id -> {key: content}，來源案例 hover 用，見 loadEpisodicByKey()
  evalCases: undefined, // GET /memory/eval-cases 的靜態案例清單（跟 scope 無關，全域一份）；undefined=沒抓過，"loading"=抓取中，見 loadEvalCases()
  review: null, // 有值＝記憶蒸餾器 modal 開著（見 openReviewModal()），null＝關閉
};

const nodeById = id => nodes.find(n => n.id === id);
const pad = n => String(n).padStart(2, "0");
const fmtTime = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };

function currentSnap() {
  return state.viewId ? state.snapshots[state.viewId] || null : null;
}

function slotChanged(n, key) {
  const d = DEFAULTS[n.id];
  if (!d) return false;
  if (key === "model") return n.model !== d.model;
  return n.memory !== d.memory;
}

const allTools = n => n.servers.flatMap(s => s.tools.map(t => ({ ...t, full: s.name + "__" + t.name })));
const toolOn = (n, full) => allTools(n).some(t => t.full === full && t.on);

// n.id -> {model, memory} 剛存檔成功時的樣子，slotChanged() 拿來跟目前值比較、
// 決定要不要顯示「已更換」標籤。工具分頁改成唯讀清單（只列已授權的，不能在
// 這裡勾選變更）之後，工具就沒有「已更換」這回事可比了。
const DEFAULTS = {};
function snapshotDefaults(n) {
  DEFAULTS[n.id] = { model: n.model, memory: n.memory };
}

/* ================= 從後端資料建節點 ================= */

function schemaToFields(schema) {
  const props = (schema && schema.properties) || {};
  const required = new Set((schema && schema.required) || []);
  return Object.entries(props).map(([k, p]) => ({
    k, req: required.has(k),
    t: p.type === "array" ? ((p.items && p.items.type) ? p.items.type + "[]" : "array") : (p.type || "string"),
  }));
}

function isGranted(grantedPatterns, fullName) {
  if (grantedPatterns.includes(fullName)) return true;
  return grantedPatterns.includes(fullName.split("__")[0] + "__*");
}

/** 這個 agent 掛了哪些 MCP server／工具——目錄本身（server/工具名/schema）
 * 來自平台共用的 GET /catalog，這個 agent 實際開了哪些則是 step.tools
 * （resolve_allowed() 算出的授權集合，見 demo/api.py）。跟舊版不同：目錄
 * 現在是真的所有 agent 共用一份，不是每個 agent 各自從零挑。 */
function buildNodeServers(grantedTools) {
  const byServer = {};
  Object.entries(state.catalog.tools).forEach(([full, info]) => {
    const tool = full.slice(info.server.length + 2);
    (byServer[info.server] = byServer[info.server] || []).push({ name: tool, full, on: isGranted(grantedTools, full) });
  });
  return Object.entries(byServer).map(([name, tools]) => ({ name, tools }));
}

/** 把後端一份 step config 套進既有節點——初次建節點跟每次 PUT 存檔回來都
 * 走這條，兩處不用各寫一份。只覆寫「後端管的」欄位（model/prompt/工具/記憶）
 * ，畫布座標、desc、schema、mapping 這些前端自己的東西不動。存完順手
 * snapshotDefaults()，「已更換」標籤就是拿這裡存的值跟目前值比。 */
function applyStepConfig(n, step) {
  n.model = step.model;
  n.memory = step.memory_enabled;
  n.memoryLocked = !step.memory_capable;
  n.memoryNote = step.memory_capable ? "" : "這個 agent 沒有長期記憶授權可以開。";
  n.namespaces = step.memory_namespaces || [];
  n.servers = buildNodeServers(step.tools);
  n.promptSystem = step.prompt ? step.prompt.system : "";
  n.promptUser = step.prompt ? step.prompt.user : "";
  // schema/output 只有獨立 agent（見 colInput/colOutput 的 currentWorkflowKind
  // 判斷）能編輯，但一律照後端最新版本刷新——workflow 裡的 step 這幾樣也是
  // 會變的（只是變的來源是別人手動改 YAML，不是這個 UI），跟 model/prompt
  // 用同一條刷新路徑。
  n.inputSchema = schemaToFields(step.input_schema);
  n.outputSchema = schemaToFields(step.output_schema);
  n.rawInputMapping = step.input_mapping || {};
  n.output = step.output || {};
  snapshotDefaults(n);
}

function nodeFromStepConfig(step, index, last) {
  const n = {
    id: step.name, desc: step.name,
    x: last ? last.x + 260 : 70, y: last ? last.y : 90,
    mapping: {}, // resolveMappingDisplay() 填
  };
  applyStepConfig(n, step);
  return n;
}

/** 把 PUT /workflow/{name}/step/{step} 回傳的整包 workflow（跟 GET 同形狀）
 * 套回畫布上對應的節點。後端每次回的是完整清單，這裡全套一遍而不是只套
 * 剛存的那個 step，省得另外分岔一條「只更新一個節點」的路徑。 */
function applyWorkflowResponse(data) {
  data.steps.forEach(step => {
    const n = nodeById(step.name);
    if (n) applyStepConfig(n, step);
  });
}

async function saveStep(n, patch) {
  try {
    const res = await fetch(`${API}/workflow/${state.currentWorkflow}/step/${n.id}`, {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify(patch),
    });
    if (!res.ok) throw new Error(await res.text());
    applyWorkflowResponse(await res.json());
    resolveMappingDisplay(); // 欄位可能剛被改過（獨立 agent 的 schema 編輯），來源對應要重算
  } catch (e) {
    showError("儲存失敗：" + e.message);
  }
  renderNodes(); renderInspector();
}

/** 把後端的 input_mapping（{field: {from: "steps.<step>.<field>"} | {const} |
 * {expr}}）轉成畫面要顯示的形狀，順便補上後端「沒宣告就同名比對」的隱含規則
 * （orchestrator/workflow_def.py::resolve_step_input()）——這只是給畫面看的
 * 唯讀推導，實際執行永遠是後端自己那套邏輯算的，不是這裡。 */
function resolveMappingDisplay() {
  nodes.forEach((n, idx) => {
    const upstream = nodes.slice(0, idx);
    n.inputSchema.forEach(f => {
      const raw = n.rawInputMapping[f.k];
      if (raw) {
        if (raw.const !== undefined) { n.mapping[f.k] = { const: raw.const }; return; }
        if (raw.expr !== undefined) { n.mapping[f.k] = { expr: raw.expr }; return; }
        if (raw.from) {
          const parts = raw.from.split(".");
          n.mapping[f.k] = { from: parts.length === 3 ? `${parts[1]}.${parts[2]}` : raw.from };
          return;
        }
      }
      if (idx === 0) { n.mapping[f.k] = { from: "$run" }; return; }
      for (let i = upstream.length - 1; i >= 0; i--) {
        if (upstream[i].outputSchema.some(o => o.k === f.k)) {
          n.mapping[f.k] = { from: `${upstream[i].id}.${f.k}`, implicit: true };
          return;
        }
      }
      n.mapping[f.k] = {};
    });
  });
}

/** 這條連線上有幾個欄位真的在傳資料 */
function edgeFieldCount(a, b) {
  return Object.values(b.mapping).filter(m => m.from && m.from.startsWith(a.id + ".")).length;
}

/* ================= 執行狀態 → 節點著色 ================= */

function computeStatusMap() {
  const snap = currentSnap();
  const map = {};
  if (!snap || !snap.current_step) { nodes.forEach(n => (map[n.id] = "idle")); return map; }
  const idx = nodes.findIndex(n => n.id === snap.current_step);
  nodes.forEach((n, i) => {
    if (idx === -1) map[n.id] = "idle";
    else if (i < idx) map[n.id] = "done";
    else if (i === idx) map[n.id] = snap.status === "running" ? "running" : snap.status === "completed" ? "done" : "bad";
    else map[n.id] = "idle";
  });
  return map;
}

/** 這個欄位這次執行實際解析出來的值——從真實的 state_payload 裡讀
 * （state_payload._steps.<step>.<field> 是每個成功步驟的完整輸出，
 * state_payload.<field> 是觸發這次執行時給的原始輸入），不是用假資料猜的。*/
function resolvedValueFor(n, fieldKey) {
  const snap = currentSnap();
  if (!snap || !snap.state_payload) return undefined;
  const m = n.mapping[fieldKey] || {};
  if (m.const !== undefined) return m.const;
  if (m.from === "$run") return snap.state_payload[fieldKey];
  if (m.from) {
    const [srcId, srcField] = m.from.split(".");
    const steps = snap.state_payload._steps || {};
    return steps[srcId] ? steps[srcId][srcField] : undefined;
  }
  return undefined;
}

/* ================= 執行控制 ================= */

function stopRun() {
  clearInterval(state.poller);
  state.poller = null;
  state.running = false;
}

async function startRun() {
  if (!(nodes.length > 0 && state.currentWorkflowKind === "workflow")) return;
  stopRun();
  state.timedOut = false;
  state.pollCount = 0;
  state.expanded.clear();
  setTab("log");

  let thread_id;
  try {
    const res = await fetch(`${API}/run`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ workflow: state.currentWorkflow, payload: { audio_ref: state.audio } }),
    });
    if (!res.ok) throw new Error(await res.text());
    ({ thread_id } = await res.json());
  } catch (e) {
    showError("啟動執行失敗：" + e.message);
    return;
  }

  state.liveThreadId = thread_id;
  state.viewId = thread_id;
  state.running = true;
  state.snapshots[thread_id] = { current_step: nodes[0].id, status: "running", state_payload: {}, calls: [] };
  renderAll();

  const poll = async () => {
    state.pollCount++;
    if (state.pollCount > 90) { stopRun(); state.timedOut = true; renderAll(); return; }
    try {
      const res = await fetch(`${API}/run/${thread_id}`);
      if (res.ok) {
        const data = await res.json();
        state.snapshots[thread_id] = data;
        if (TERMINAL_STATUSES.includes(data.status)) {
          stopRun();
          if (!state.history.some(h => h.threadId === thread_id)) {
            state.history.unshift({ threadId: thread_id, when: "剛剛", workflow: state.currentWorkflow, audio: state.audio });
          }
        }
      }
    } catch (e) { /* 暫時連不上，下一輪 poll 再試 */ }
    renderAll();
  };
  state.poller = setInterval(poll, 1000);
  poll();
}

async function viewRun(threadId) {
  state.viewId = threadId;
  if (!state.snapshots[threadId]) {
    try {
      const res = await fetch(`${API}/run/${threadId}`);
      if (res.ok) state.snapshots[threadId] = await res.json();
    } catch (e) { /* ignore */ }
  }
  state.expanded.clear();
  renderAll();
}

/* ================= 載入 workflow ================= */

async function loadWorkflow(value) {
  stopRun();
  nodes.length = 0;
  Object.keys(DEFAULTS).forEach(k => delete DEFAULTS[k]);
  state.selected = null;
  state.testInput = {}; state.testOut = {}; state.testing = null;
  state.schemaEdit = {};
  state.memCache = {}; state.memNode = null;
  state.history = [];
  state.snapshots = {};
  state.viewId = null; state.liveThreadId = null; state.timedOut = false;
  state.expanded.clear();
  state.openResults.clear();
  state.currentWorkflow = value;
  state.currentWorkflowKind = "";
  populateAudioSelect();

  if (value) {
    try {
      const res = await fetch(`${API}/workflow/${value}`);
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      state.currentWorkflowKind = data.kind;
      let last = null;
      data.steps.forEach((step, i) => { const n = nodeFromStepConfig(step, i, last); nodes.push(n); last = n; });
      resolveMappingDisplay();
    } catch (e) {
      console.error("failed to load workflow", value, e);
      showError(`載入 ${value} 失敗：` + e.message);
    }
  }
  renderAll();
}
