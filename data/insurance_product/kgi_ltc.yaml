# 凱基人壽享安心長期照顧終身保險 保單條款 -- 一次性切分結果
# (docs/exclusion-scenario-plan.md P3)
#
# 人工切分自「保單條款.pdf」，切分依據 §3.2 的通則：分段跟著 agent 會問的問題走
# （除外責任/給付條件/申領文件…），不是照文件目錄的章節序號走。scripts/seed_insurance_memory.py
# 讀這份檔案寫進 semantic 長期記憶，namespace 是
# `_global/semantic/insurance_product/kgi_ltc/<這裡的 segment 路徑>`。
#
# 每個節點:
#   title/summary  -> 寫成該 namespace 的 _index item（browse() 用來給 agent 看的一句話說明）
#   children       -> 底下還有分支（本身不會有 articles）
#   articles       -> 這是葉節點，每條是實際存進去的一筆記憶
#     key         -> 這條記憶的 item key
#     article     -> 條號/附表編號（人類可讀）
#     title       -> 這條的標題
#     text        -> 全文（盡量逐字，長篇附註在不影響判斷的前提下摘要）
#     applies_to  -> 這條的效力範圍涉及哪些其他條號（供交叉引用）

title: 凱基人壽享安心長期照顧終身保險
summary: >-
  凱基人壽「享安心長期照顧終身保險」保單條款 -- 涵蓋長期照顧一次/分期保險金、完全失能一次/分期保險金、
  意外二至三級失能一次/分期保險金、身故保險金或喪葬費用保險金、祝壽保險金、豁免保險費。不分紅保單，無解約金。
children:
  - segment: definitions
    title: 名詞定義
    summary: >-
      第二條的名詞定義 -- 疾病、傷害、意外傷害事故、醫院、醫師、專科醫師、「長期照顧狀態」
      （生理功能障礙的 ADLs 六項判定、認知功能障礙的 CDR 判定）、免責期間、應已繳保險費、
      保險金額、壽險當年度保險金額。
    articles:
      - key: article_02
        article: 第二條
        title: 名詞定義
        applies_to: []
        text: |
          本契約所稱名詞定義如下：
          一、本契約所稱「疾病」係指被保險人自本契約生效日或復效日（含）起所發生之疾病。
          二、本契約所稱「傷害」係指被保險人於本契約有效期間內，遭受意外傷害事故，因而蒙受之傷害。
          三、本契約所稱「意外傷害事故」係指非由疾病引起之外來突發事故。
          四、本契約所稱「醫院」係指依照醫療法規定領有開業執照並設有病房收治病人之公、私立及醫療法人醫院。
          五、本契約所稱「醫師」係指領有醫師證書並合法執業者，且非被保險人或要保人本人者。
          六、本契約所稱「專科醫師」係指經醫師考試及格並完成專科醫師訓練，且經衛生福利部甄審合格，領有復健科、
             神經科、精神科或主要疾病相關科別之專科醫師證書者之執業醫師，且非被保險人或要保人本人者。
          七、本契約所稱「長期照顧狀態」係指被保險人於本契約有效期間內，因疾病、傷害、體質衰弱或認知障礙經醫院
             專科醫師診斷判定，符合下列之生理功能障礙或認知功能障礙二項情形之一者。
             (一) 生理功能障礙：係指被保險人經醫院專科醫師依巴氏量表(Barthel Index)或依其它臨床專業評量表診斷
                判定，其進食、移位、如廁、沐浴、平地行動及更衣等六項日常生活自理能力(ADLs)持續存有三項(含)以上
                之障礙。六項 ADLs 存有障礙之定義：
                1. 進食障礙：須別人協助才能取用食物或穿脫進食輔具。
                2. 移位障礙：須別人協助才能由床移位至椅子或輪椅。
                3. 如廁障礙：如廁過程中須別人協助才能保持平衡、整理衣物或使用衛生紙。
                4. 沐浴障礙：須別人協助才能完成盆浴或淋浴。
                5. 平地行動障礙：雖經別人扶持或使用輔具亦無法行動，且須別人協助才能操作輪椅或電動輪椅。
                6. 更衣障礙：須別人完全協助才能完成穿脱衣褲鞋襪(含義肢、支架)。
             (二) 認知功能障礙：係指被保險人經醫院專科醫師診斷判定為失智狀態（按「國際疾病傷害及死因分類標準」
                第十版（ICD-10-CM），如附表一所列項目），且依臨床失智量表（CDR）評估達中度(含)以上
                (即 CDR 大於或等於 2 分，非各分項總和)者。
          八、本契約所稱「免責期間」係指被保險人經醫院專科醫師診斷確定為「長期照顧狀態」之日起算，且持續符合
             「長期照顧狀態」達九十日之期間。
          九、本契約所稱「應已繳保險費」，於繳費期間內，係指以被保險人發生本契約約定保險事故當時的「保險金額」
             為準，按本險標準體年繳保險費乘以當時保單年度數所得之金額；於繳費期滿後，係指以被保險人發生本契約
             約定保險事故當時的「保險金額」為準，按本險標準體年繳保險費乘以保險單上所載之繳費年期所得之金額。
          十、本契約所稱「保險金額」係指保險單所載本契約之「保險金額」，若該金額有所變更時，以變更後之金額為準。
          十一、本契約所稱「壽險當年度保險金額」係指「應已繳保險費」之一點零六倍扣除依第十二條至第十七條累積已付
             之各項保險金後之餘額。

  - segment: benefits
    title: 各項保險金給付
    summary: >-
      保險範圍總說（第五條）與各項保險金的給付條件、給付金額、給付次數上限（第十二條至第二十一條）：
      長期照顧一次/分期保險金、完全失能一次/分期保險金、意外二至三級失能一次/分期保險金、
      身故保險金或喪葬費用保險金、祝壽保險金、長期照顧分期保險金給付之暫停、豁免保險費。
    articles:
      - key: article_05
        article: 第五條
        title: 保險範圍
        applies_to: ["第十二條", "第十四條", "第十六條", "第十八條", "第十九條", "第二十一條"]
        text: |
          被保險人於本契約有效期間內身故、診斷確定致成附表二所列完全失能程度之一、因第二條約定之疾病或傷害致成
          附表三所列第一至六級失能程度之一、免責期間屆滿持續符合第二條第七款之「長期照顧狀態」或於保險年齡到達
          一百歲之保單週年日仍生存時，本公司依本契約約定給付保險金或豁免保險費。

      - key: article_12
        article: 第十二條
        title: 長期照顧一次保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內，經醫院專科醫師診斷確定符合第二條約定之「長期照顧狀態」，並於免責期間持續
          符合長期照顧狀態且於免責期間屆滿時仍生存者，本公司於免責期間終了之翌日，按診斷確定日當時「保險金額」
          給付「長期照顧一次保險金」，且本契約有效期間內以給付一次為限。但本公司已依第十四條給付「完全失能一次
          保險金」或依第十六條給付「意外二至三級失能一次保險金」，不再給付「長期照顧一次保險金」。

      - key: article_13
        article: 第十三條
        title: 長期照顧分期保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內，經醫院專科醫師診斷確定符合第二條約定之「長期照顧狀態」，並於免責期間持續
          符合長期照顧狀態且於免責期間屆滿時仍生存者，本公司於免責期間終了之翌日，按診斷確定日當時「保險金額」
          給付第一期「長期照顧分期保險金」，並於之後每屆滿一年之日，且被保險人仍生存並持續符合「長期照顧狀態」
          時，本公司按診斷確定日當時「保險金額」，給付第二期（含）以後之「長期照顧分期保險金」。但本公司已依
          第十五條給付「完全失能分期保險金」或依第十七條給付「意外二至三級失能分期保險金」，於給付期間不再給付
          「長期照顧分期保險金」。本項給付與第十五條、第十七條合計，本契約有效期間內最多給付十六次。

      - key: article_14
        article: 第十四條
        title: 完全失能一次保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內經醫院醫師診斷確定致成附表二所列完全失能程度之一者，本公司按其完全失能診斷
          確定日當時「保險金額」給付「完全失能一次保險金」，且本契約有效期間內以給付一次為限。但本公司已依第
          十二條給付「長期照顧一次保險金」或依第十六條給付「意外二至三級失能一次保險金」，不再給付「完全失能
          一次保險金」。

      - key: article_15
        article: 第十五條
        title: 完全失能分期保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內經醫院醫師診斷確定致成附表二所列完全失能程度之一者，本公司按其完全失能診斷
          確定日當時「保險金額」給付第一期「完全失能分期保險金」，並於之後每屆滿一年之日，且被保險人仍生存時，
          給付第二期（含）以後之「完全失能分期保險金」。但本公司已依第十三條給付「長期照顧分期保險金」或依第
          十七條給付「意外二至三級失能分期保險金」，於給付期間不再給付「完全失能分期保險金」。本項給付與第十三
          條、第十七條合計，本契約有效期間內最多給付十六次。

      - key: article_16
        article: 第十六條
        title: 意外二至三級失能一次保險金的給付
        applies_to: []
        text: |
          若被保險人遭受第二條約定之「意外傷害事故」時之保險年齡超過八十歲，則無本條之適用。被保險人於本契約
          有效期間內遭受第二條所稱意外傷害事故，自意外傷害事故發生之日起一百八十日以內經醫院醫師診斷確定致成
          附表三所列第二至三級失能程度之一者，本公司按其失能診斷確定日當時「保險金額」給付「意外二至三級失能
          一次保險金」。但超過一百八十日致成失能者，受益人若能證明被保險人之失能與該意外傷害事故具有因果關係
          者，不在此限。本契約有效期間內以給付一次為限。若本公司已依第十二條給付「長期照顧一次保險金」或依第
          十四條給付「完全失能一次保險金」，不再給付「意外二至三級失能一次保險金」。

      - key: article_17
        article: 第十七條
        title: 意外二至三級失能分期保險金的給付
        applies_to: []
        text: |
          若被保險人遭受第二條約定之「意外傷害事故」時之保險年齡超過八十歲，則無本條之適用。被保險人於本契約
          有效期間內遭受第二條所稱意外傷害事故，自意外傷害事故發生之日起一百八十日以內經醫院醫師診斷確定致成
          附表三所列第二至三級失能程度之一者，本公司按其失能診斷確定日當時「保險金額」給付第一期「意外二至三
          級失能分期保險金」，並於之後每屆滿一年之日，且被保險人仍生存時，給付第二期（含）以後之「意外二至三
          級失能分期保險金」。但超過一百八十日致成失能者，受益人若能證明因果關係者，不在此限。若本公司已依第
          十三條給付「長期照顧分期保險金」或依第十五條給付「完全失能分期保險金」，於給付期間不再給付「意外二
          至三級失能分期保險金」。本項給付與第十三條、第十五條合計，本契約有效期間內最多給付十六次。

      - key: article_18
        article: 第十八條
        title: 身故保險金或喪葬費用保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內身故者，本公司按其身故當時「壽險當年度保險金額」給付「身故保險金」，本契約
          效力即行終止。如本公司依第十二條至第十七條累積已付之各項保險金總額已達「應已繳保險費」之一點零六倍，
          本公司不再給付「身故保險金」，本契約效力即行終止。訂立本契約時，以受監護宣告尚未撤銷者為被保險人，
          其「身故保險金」變更為喪葬費用保險金，且喪葬費用保險金額總和不得超過遺產及贈與稅法有關遺產稅喪葬費
          扣除額之半數。

      - key: article_19
        article: 第十九條
        title: 祝壽保險金的給付
        applies_to: []
        text: |
          被保險人於本契約有效期間內保險年齡到達一百歲之保單週年日仍生存時，本公司按「壽險當年度保險金額」給付
          「祝壽保險金」，本契約效力即行終止。如本公司依第十二條至第十七條累積已付之各項保險金總額已達「應已
          繳保險費」之一點零六倍，本公司不再給付「祝壽保險金」，本契約效力即行終止。

      - key: article_20
        article: 第二十條
        title: 長期照顧分期保險金給付之暫停
        applies_to: ["第十三條", "第十五條", "第十七條"]
        text: |
          本公司依第十三條、第十五條及第十七條合計給付次數尚未達十六次給付上限前，若有下列情形之一者，本公司將
          暫停該期及嗣後「長期照顧分期保險金」之給付：一、被保險人「長期照顧狀態」已消滅。二、受益人未依第二十
          二條約定檢齊相關申請文件。被保險人於繳費期間內發生前述情形者，要保人得繼續繳交保險費至繳費期間屆滿，
          使本契約繼續有效；嗣後再符合第十三條約定之給付條件時，本公司仍依約定給付並豁免保險費。因第二款情形
          暫停者，受益人補齊文件後，本公司應於五日內補足暫停期間內符合「長期照顧狀態」而未給付的部分。

      - key: article_21
        article: 第二十一條
        title: 豁免保險費
        applies_to: ["第二十七條"]
        text: |
          被保險人於本契約有效期間內經醫院醫師診斷確定因第二條約定之疾病或傷害致成附表三所列第一至六級失能程度
          之一，或經醫院專科醫師診斷確定符合第二條約定之「長期照顧狀態」，並於免責期間持續符合長期照顧狀態且於
          免責期間屆滿時仍生存者，本公司自診斷確定日或免責期間屆滿日之翌日起，豁免本契約（不含其他附約）續期
          保險費，但當期之未到期保險費將不予退還。符合前項情形者，本公司不再受理變更本契約內容或終止本契約。
          若被保險人因第二十條約定之事由致本公司暫停給付「長期照顧分期保險金」且未因疾病或傷害致成附表三所列
          第一至六級失能程度之一時，本公司即暫停豁免保險費，要保人應繼續交付保險費使本契約繼續有效。

  - segment: exclusions
    title: 除外責任與不保事項
    summary: >-
      除外責任與不保事項（第二十七條至第三十一條）-- 哪些原因造成的失能或長期照顧狀態，公司不負給付責任：
      故意行為（含自殺）、犯罪行為、施用毒品、酒駕、戰爭、核污染、特技/競賽表演等。
      注意：第二十七條（長照給付的除外責任）跟第二十九條（意外二至三級失能給付的除外責任）
      適用範圍不同，同一原因（例如酒駕）可能只排除其中一種給付，不是兩種都排除。
    articles:
      - key: article_27
        article: 第二十七條
        title: 除外責任（一）
        applies_to: ["第十二條", "第十三條", "第二十一條"]
        text: |
          被保險人因下列原因所致之疾病或傷害而致成附表三所列第一至六級失能程度之一，或經醫院專科醫師診斷確定
          符合第二條約定之「長期照顧狀態」者，本公司不負給付第十二條至第十三條各項保險金及第二十一條豁免保險費
          的責任：
          一、被保險人之故意行為（包括自殺及自殺未遂）。
          二、被保險人之犯罪行為。
          三、被保險人非法施用防制毒品相關法令所稱之毒品。

      - key: article_28
        article: 第二十八條
        title: 除外責任（二）
        applies_to: ["第十四條", "第十五條", "第十八條"]
        text: |
          有下列情形之一者，本公司不負給付第十四條、第十五條及第十八條（完全失能一次/分期保險金、身故保險金或
          喪葬費用保險金）的責任：
          一、要保人故意致被保險人於死。
          二、被保險人故意自殺或自成失能。但自本契約訂立或復效之日起二年後故意自殺致死者，本公司仍負給付「身
             故保險金或喪葬費用保險金」之責任。
          三、被保險人因犯罪處死或拒捕或越獄致死或失能。
          前項第一款及第三十一條情形致被保險人失能時，本公司仍按第十四條及第十五條的約定給付各項保險金。

      - key: article_29
        article: 第二十九條
        title: 除外責任（三）
        applies_to: ["第十六條", "第十七條"]
        text: |
          被保險人因下列原因致成附表三所列第二至三級失能程度之一時，本公司不負給付第十六條及第十七條（意外二
          至三級失能一次/分期保險金）保險金的責任：
          一、要保人、被保險人的故意行為。
          二、被保險人犯罪行為。
          三、被保險人飲酒後駕（騎）車，其吐氣或血液所含酒精成份超過道路交通法令規定標準者。
          四、戰爭（不論宣戰與否）、內亂及其他類似的武裝變亂。但契約另有約定者不在此限。
          五、因原子或核子能裝置所引起的爆炸、灼熱、輻射或污染。但契約另有約定者不在此限。
          前項第一款情形（除被保險人的故意行為外），致被保險人成第二至三級失能程度之一時，本公司仍按第十六條
          及第十七條的約定給付各項保險金。

      - key: article_30
        article: 第三十條
        title: 不保事項
        applies_to: ["第十六條", "第十七條"]
        text: |
          被保險人從事下列活動，致成附表三所列第二至三級失能程度之一時，除契約另有約定外，本公司不負給付第
          十六條及第十七條保險金的責任：
          一、被保險人從事角力、摔跤、柔道、空手道、跆拳道、馬術、拳擊、特技表演等的競賽或表演。
          二、被保險人從事汽車、機車及自由車等的競賽或表演。

      - key: article_31
        article: 第三十一條
        title: 受益人受益權之喪失
        applies_to: ["第十四條", "第十五條", "第十八條"]
        text: |
          受益人故意致被保險人於死或雖未致死者，喪失其受益權。如因該受益人喪失受益權，而致無受益人受領保險
          金額時，其保險金額作為被保險人遺產。如有其他受益人者，喪失受益權之受益人原應得之部分，按其他受益人
          原約定比例分歸其他受益人。

  - segment: claims
    title: 保險金的申領文件
    summary: >-
      各項保險金／豁免保險費的申領應檢具文件（第二十二條至第二十六條）：長期照顧一次/分期保險金、
      完全失能/意外失能一次/分期保險金、身故或喪葬費用保險金、祝壽保險金、豁免保險費申請各自要準備的文件清單。
    articles:
      - key: article_22
        article: 第二十二條
        title: 長期照顧一次/分期保險金的申領
        applies_to: ["第十二條", "第十三條"]
        text: |
          受益人申領「長期照顧一次保險金」時，應檢具：一、保險單或其謄本。二、最近一個月內醫院所開具符合
          「長期照顧狀態」的診斷證明書及相關專科醫師開具之巴氏量表（Barthel Index）或臨床失智評分量表（CDR）
          或其他專業評量表。三、長期照顧狀態之相關病歷摘要。四、保險金申請書。每年申領「長期照顧分期保險金」
          時，第一期得併同前項辦理，之後每一給付日的五日前檢齊上述文件覆查，並應另檢具被保險人之生存證明。

      - key: article_23
        article: 第二十三條
        title: 完全失能/意外失能一次或分期保險金的申領
        applies_to: ["第十四條", "第十五條", "第十六條", "第十七條"]
        text: |
          受益人申領「完全失能一次保險金」、「完全失能分期保險金」、「意外二至三級失能一次保險金」或「意外二
          至三級失能分期保險金」時，應檢具：一、保險金申請書。二、保險單或其謄本。三、失能診斷書；必要時本公
          司得要求提供意外傷害事故證明文件。四、受益人的身分證明。每年申領分期保險金時，應另檢具被保險人之
          生存證明。

      - key: article_24
        article: 第二十四條
        title: 身故保險金或喪葬費用保險金的申領
        applies_to: ["第十八條"]
        text: |
          受益人申領「身故保險金或喪葬費用保險金」時，應檢具：一、保險單或其謄本。二、被保險人死亡證明書及除
          戶戶籍謄本。三、保險金申請書。四、受益人的身分證明。

      - key: article_25
        article: 第二十五條
        title: 祝壽保險金的申領
        applies_to: ["第十九條"]
        text: |
          受益人申領「祝壽保險金」時，應檢具：一、保險單或其謄本。二、保險金申請書。三、受益人的身分證明。

      - key: article_26
        article: 第二十六條
        title: 豁免保險費的申請
        applies_to: ["第二十一條"]
        text: |
          要保人因被保險人符合第二十一條之約定申請保險費豁免時，應檢具：一、保險金申請書。二、保險單或其謄本。
          三、因疾病或傷害致成第一至六級失能程度之一申請者，另需檢具失能診斷書。四、符合長期照顧狀態申請者，
          另需檢具長期照顧狀態之相關病歷摘要及最近一個月內醫院所開具符合長期照顧狀態的診斷證明書及相關專科
          醫師開具之巴氏量表（Barthel Index）或臨床失智評分量表（CDR）或其他專業評量表。五、要保人及被保險人
          的身分證明。符合長期照顧狀態申請者，要保人每年應檢送第四款文件覆查。

  - segment: contract
    title: 契約行政條款
    summary: >-
      契約成立、撤銷、保險費交付與寬限期間、效力停止與復效、告知義務與解除、契約終止、保險事故通知與遲延利息、
      失蹤處理、欠繳保險費扣除、保險金額減少、不分紅、投保年齡錯誤處理、受益人指定變更、變更住所、時效、批註、
      管轄法院（第一、三至十一、三十二至四十條）-- 跟「賠不賠」的判斷無直接關係，是行政程序條款。
    articles:
      - key: article_01
        article: 第一條
        title: 保險契約的構成
        applies_to: []
        text: |
          本保險單條款、附著之要保書、批註及其他約定書，均為本保險契約的構成部分。本契約的解釋，應探求契約
          當事人的真意，不得拘泥於所用的文字；如有疑義時，以作有利於被保險人的解釋為原則。

      - key: article_03
        article: 第三條
        title: 契約撤銷權
        applies_to: []
        text: |
          要保人於保險單送達的翌日起算十日內，得以書面檢同保險單向本公司撤銷本契約。撤銷的效力應自要保人書面
          之意思表示到達翌日零時起生效，本契約自始無效，本公司應無息退還要保人所繳保險費；撤銷生效後所發生的
          保險事故，本公司不負保險責任。但撤銷生效前，若發生保險事故者，視為未撤銷，本公司仍應依約定負保險
          責任。

      - key: article_04
        article: 第四條
        title: 保險責任的開始及交付保險費
        applies_to: []
        text: |
          本公司應自同意承保並收取第一期保險費後負保險責任，並應發給保險單作為承保的憑證。本公司如於同意承保
          前，預收相當於第一期保險費之金額時，其應負之保險責任，以同意承保時溯自預收該金額時開始。

      - key: article_06
        article: 第六條
        title: 第二期以後保險費的交付、寬限期間及契約效力的停止
        applies_to: []
        text: |
          分期繳納的第二期以後保險費到期未交付時，年繳或半年繳者，自催告到達翌日起三十日內為寬限期間；月繳或
          季繳者，自保險單所載交付日期之翌日起三十日為寬限期間。逾寬限期間仍未交付者，本契約自寬限期間終了
          翌日起停止效力。如在寬限期間內發生保險事故時，本公司仍負保險責任。

      - key: article_07
        article: 第七條
        title: 本契約效力的恢復
        applies_to: []
        text: |
          本契約停止效力後，要保人得在停效日起二年內，申請復效，但保險期間屆滿後不得申請。停止效力之日起六個
          月內申請者，清償保險費扣除停效期間危險保險費後之餘額後，自翌日上午零時起恢復效力。六個月後申請者，
          本公司得要求提供可保證明，被保險人危險程度重大變更已達拒絕承保程度者，本公司得拒絕復效。

      - key: article_08
        article: 第八條
        title: 告知義務與本契約的解除
        applies_to: []
        text: |
          要保人及被保險人在訂立本契約時，對於要保書書面詢問的告知事項應據實說明，如有隱匿、遺漏或不實說明，
          足以變更或減少本公司對於危險的估計者，本公司得解除本契約，其保險事故發生後亦同。但危險的發生未基於
          其說明或未說明的事實時，不在此限。解除契約權，自本公司知有解除之原因後，經過一個月不行使而消滅；或
          自本契約訂立後，經過二年不行使而消滅。

      - key: article_09
        article: 第九條
        title: 契約的終止
        applies_to: []
        text: |
          要保人得隨時終止本契約。契約之終止，自本公司收到要保人書面通知時，開始生效。要保人終止本契約時，本
          公司應從當期已繳保險費扣除按日數比例計算已經過期間之保險費後，退還要保人。

      - key: article_10
        article: 第十條
        title: 保險事故的通知、保險金的申請時間及遲延利息
        applies_to: []
        text: |
          要保人、被保險人或受益人應於知悉本公司應負保險責任之事故後十日內通知本公司，並儘速檢具所需文件申請
          給付保險金。本公司應於收齊文件後十五日內給付之。但因可歸責於本公司之事由致未在期限內給付者，應按
          年利一分加計利息給付。

      - key: article_11
        article: 第十一條
        title: 失蹤處理
        applies_to: ["第十八條"]
        text: |
          被保險人在本契約有效期間內失蹤者，如經法院宣告死亡時，本公司根據判決內所確定死亡時日為準給付身故
          保險金；如能提出證明文件足以認為被保險人極可能因意外傷害事故而死亡者，本公司應依意外傷害事故發生
          日為準給付。若發現被保險人生還時，要保人或受益人應將已領之保險金歸還本公司。

      - key: article_32
        article: 第三十二條
        title: 欠繳保險費的扣除
        applies_to: []
        text: |
          本公司給付各項保險金時，如要保人有欠繳保險費者，本公司得先抵銷上述欠繳保險費後給付其餘額。

      - key: article_33
        article: 第三十三條
        title: 保險金額的減少
        applies_to: []
        text: |
          要保人在本契約有效期間內，得申請減少「保險金額」，但減額後的「保險金額」，不得低於本契約最低承保
          金額，其減少部分依第九條契約的終止之約定處理。

      - key: article_34
        article: 第三十四條
        title: 不分紅保險單
        applies_to: []
        text: |
          本保險為不分紅保單，不參加紅利分配，並無紅利給付項目。

      - key: article_35
        article: 第三十五條
        title: 投保年齡的計算及錯誤的處理
        applies_to: []
        text: |
          被保險人的投保年齡，以足歲計算，但未滿一歲的零數超過六個月者，加算一歲。投保年齡發生錯誤時，依真實
          投保年齡較費率表所載最高年齡為大、溢繳、短繳等情形分別處理，錯誤原因歸責於本公司者應加計利息退還
          保險費。

      - key: article_36
        article: 第三十六條
        title: 受益人的指定及變更
        applies_to: []
        text: |
          第十二條至第十七條各項保險金的受益人，為被保險人本人，本公司不受理其指定及變更。除此之外，要保人得
          依規定指定或變更受益人，並應符合指定或變更當時法令之規定。

      - key: article_37
        article: 第三十七條
        title: 變更住所
        applies_to: []
        text: |
          要保人的住所有變更時，應即以書面通知本公司。要保人不為前項通知者，本公司之各項通知，得以本契約所載
          要保人之最後住所發送之。

      - key: article_38
        article: 第三十八條
        title: 時效
        applies_to: []
        text: |
          由本契約所生的權利，自得為請求之日起，經過兩年不行使而消滅。

      - key: article_39
        article: 第三十九條
        title: 批註
        applies_to: []
        text: |
          本契約內容的變更，或記載事項的增刪，除第三十六條規定者外，應經要保人與本公司雙方書面或其他約定方式
          同意，並由本公司即予批註或發給批註書。

      - key: article_40
        article: 第四十條
        title: 管轄法院
        applies_to: []
        text: |
          因本契約涉訟者，同意以要保人住所所在地地方法院為第一審管轄法院，要保人的住所在中華民國境外時，以本
          公司總公司所在地地方法院為第一審管轄法院。但不得排除消費者保護法第四十七條及民事訴訟法第四百三十六
          條之九小額訴訟管轄法院之適用。

  - segment: appendix
    title: 附表
    summary: >-
      三份附表：附表一（認知功能障礙適用的失智症 ICD-10-CM 疾病代碼）、附表二（完全失能程度表，七項）、
      附表三（一至六級失能程度表，按神經/眼/耳/口/胸腹部臟器/上肢/下肢分類，含各部位詳細判定基準）。
    children:
      - segment: icd10
        title: 附表一 -- 失智症 ICD-10-CM 編碼
        summary: >-
          第二條第七款第二目「認知功能障礙」適用的失智症疾病代碼清單（ICD-10-CM），判定「長期照顧狀態」
          的認知功能障礙時要對照這份清單。
        articles:
          - key: appendix_1
            article: 附表一
            title: 認知功能障礙適用之疾病（ICD-10-CM 編碼）
            applies_to: ["第二條"]
            text: |
              第二條第七款第二目所稱疾病如次：
              F01 血管性失智症 (Vascular dementia)
              F02 歸類於他處其他疾病所致之失智症 (Dementia in other diseases classified elsewhere)
              F03 未特定之失智症 (Unspecified dementia)
              F04 已知生理狀況引起的失憶症 (Amnestic disorder due to known physiological condition)
              F06.0 已知生理狀況引起有幻覺的精神病症
              F06.2 已知生理狀況引起有妄想的精神病症
              F06.8 已知生理狀況引起的其他特定精神疾病
              F07.0 已知生理狀況引起的人格變化
              F07.8 已知生理狀況引起的其他人格與行為障礙症（F07.81 腦震盪後症候群除外）
              F07.9 已知生理狀況引起的非特定人格及行為障礙症
              F09 已知生理狀況引起的非特定精神疾病
              G30 阿茲海默氏病 (Alzheimer's disease)
              G31 其他處未分類的神經系統退化性疾病
              註：若未來醫界採用新版分類標準（例如 ICD-11-CM），本公司於判斷是否符合認知功能障礙時，應以與
              新版分類標準相對應之代碼作為判斷標準。

      - segment: total_disability
        title: 附表二 -- 完全失能程度表
        summary: >-
          第十四、十五、十八、十九條「完全失能」適用的七項失能程度表：雙目失明、上肢/下肢關節缺失組合、
          喪失咀嚼或言語機能、四肢機能永久完全喪失、中樞神經系統或胸腹部臟器機能遺存極度障害。
        articles:
          - key: appendix_2
            article: 附表二
            title: 完全失能程度表
            applies_to: ["第十四條", "第十五條", "第十八條", "第十九條"]
            text: |
              項別一：雙目均失明者。
              項別二：兩上肢腕關節缺失者或兩下肢足踝關節缺失者。
              項別三：一上肢腕關節及一下肢足踝關節缺失者。
              項別四：一目失明及一上肢腕關節缺失者或一目失明及一下肢足踝關節缺失者。
              項別五：永久喪失咀嚼或言語之機能者。
              項別六：四肢機能永久完全喪失者。
              項別七：中樞神經系統機能遺存極度障害或胸、腹部臟器機能遺存極度障害，終身不能從事任何工作，經常
                需醫療護理或專人周密照護者。
              註：
              1. 失明的認定：視力依萬國式視力表測定，兩眼個別依矯正視力測定；失明係指視力永久在萬國式視力表
                 零點零二以下；以受傷之日起經過六個月的治療為判定原則，但眼球摘出等明顯無法復原之情況不在此限。
              2. 喪失咀嚼之機能：因器質障害或機能障害，以致不能作咀嚼運動，除流質食物外不能攝取者。
              3. 喪失言語之機能：口唇音、齒舌音、口蓋音、喉頭音等四種語音機能中，有三種以上不能構音者。
              4. 機能永久完全喪失：指經六個月以後其機能仍完全喪失者。
              5. 因重度神經障害，為維持生命必要之日常生活活動（食物攝取、大小便始末、穿脫衣服、起居、步行、
                 入浴等），全須他人扶助者。

      - segment: disability_1_6
        title: 附表三 -- 一至六級失能程度表
        summary: >-
          第十二、十三、十六、十七、二十一條「第一至六級失能」的判定表，按身體部位分類：神經、眼、耳、口、
          胸腹部臟器（含膀胱）、上肢（含手指）、下肢（含足趾）。每個部位底下列出各失能程度對應的失能等級
          （1 最重、6 最輕）。查失能等級要先確定是哪個部位受影響，再對照該部位的判定表。
        articles:
          - key: neuro
            article: 附表三（神經）
            title: 神經障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              中樞神經系統機能遺存極度障害，包括植物人狀態或氣切呼吸器輔助，終身無工作能力，為維持生命必要之
              日常生活活動全須他人扶助，經常需醫療護理或專人周密照護者：第 1 級。
              中樞神經系統機能遺存高度障害，須長期臥床或無法自行翻身，終身無工作能力，為維持生命必要之日常生
              活活動之一部分須他人扶助者：第 2 級。
              中樞神經系統機能遺存顯著障害，終身無工作能力，為維持生命必要之日常生活活動尚可自理者：第 3 級。
              註：審定神經障害等級須有精神科、神經科、神經外科或復健科專科醫師診斷證明及相關檢驗報告
              （簡式智能評估表 MMSE、失能評估表 mRS、臨床失智評估量表 CDR、神經電生理檢查、神經系統影像檢查等）
              為依據。有失語、失認、失行、四肢麻痺、錐體外路症狀、記憶力障害、知覺障害、感情障害、意欲減退、
              人格變化等顯著障害，或麻痺等症狀雖為輕度但身體能力仍存、非他人在身邊指示無法遂行其工作者：適用
              第 3 級。外傷性癲癇雖經充分治療、每週仍有一次以上發作者：適用第 3 級。因高度平衡機能障害終身不能
              從事任何工作，但為維持生命必要之日常生活活動仍有可能者：適用第 3 級。

          - key: eye
            article: 附表三（眼）
            title: 視力障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              雙目均失明者：第 1 級。
              雙目視力減退至 0.06 以下者：第 5 級。
              一目失明，他目視力減退至 0.06 以下者：第 4 級。
              一目失明，他目視力減退至 0.1 以下者：第 6 級。
              註：視力以萬國式視力表矯正後視力為準（矯正不能者以裸眼視力測定）；失明係指視力永久在萬國式視力
              表 0.02 以下，包括眼球喪失、摘出、僅能辨明暗或辨眼前一公尺以內手動或辨眼前五公分以內指數者；以
              受傷之日起經過六個月的治療為判定原則，但眼球摘出等明顯無法復原之情況不在此限。

          - key: ear
            article: 附表三（耳）
            title: 聽覺障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              兩耳鼓膜全部缺損或兩耳聽覺機能均喪失 90 分貝以上者：第 5 級。
              註：兩耳聽覺障害程度不同時，依優耳之聽覺障害審定；聽覺障害之測定需用精密聽力計(Audiometer)，其
              平均聽力喪失率以分貝表示；內耳損傷引起平衡機能障害之審定，準用神經障害所定等級。

          - key: oral
            article: 附表三（口）
            title: 咀嚼吞嚥及言語機能障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              永久喪失咀嚼、吞嚥或言語之機能者：第 1 級。
              咀嚼、吞嚥及言語之機能永久遺存顯著障害者：第 5 級。
              註：「喪失咀嚼、吞嚥之機能」指因器質障害或機能障害，以致不能作咀嚼、吞嚥運動，除流質食物外不能
              攝取或吞嚥者；「咀嚼、吞嚥機能遺存顯著障害」指不能充分作咀嚼、吞嚥運動，除粥、糊或類似食物外不
              能攝取或吞嚥者。「喪失言語機能」指口唇音、齒舌音、口蓋音、喉頭音四種語音機能中有三種以上不能構
              音者；「言語機能遺存顯著障害」指四種中有二種以上不能構音者。

          - key: thoracoabdominal
            article: 附表三（胸腹部臟器）
            title: 胸腹部臟器機能障害、膀胱機能障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              胸腹部臟器機能遺存極度障害，終身不能從事任何工作，經常需要醫療護理或專人周密照護者：第 1 級。
              胸腹部臟器機能遺存高度障害，終身不能從事任何工作，且日常生活需人扶助：第 2 級。
              胸腹部臟器機能遺存顯著障害，終身不能從事任何工作，但日常生活尚可自理者：第 3 級。
              膀胱機能完全喪失且無裝置人工膀胱者：第 3 級。
              註：胸部臟器指心臟、心囊、主動脈、氣管、支氣管、肺臟、胸膜及食道；腹部臟器指胃、肝臟、膽囊、胰
              臟、小腸、大腸、腸間膜、脾臟及腎上腺；泌尿器官指腎臟、輸尿管、膀胱及尿道；生殖器官指內外生殖器。
              膀胱機能完全喪失指必須永久性自腹表排尿或長期導尿者（包括永久性迴腸導管、寇克氏囊與輸尿管造口術）。

          - key: upper_limb
            article: 附表三（上肢）
            title: 上肢缺損障害、手指缺損障害、上肢機能障害、手指機能障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              上肢缺損障害：
                兩上肢腕關節缺失者：第 1 級。
                一上肢肩、肘及腕關節中，有二大關節以上缺失者：第 5 級。
                一上肢腕關節缺失者：第 6 級。
              手指缺損障害：
                雙手十指均缺失者：第 3 級。
              上肢機能障害：
                兩上肢肩、肘及腕關節均永久喪失機能者：第 2 級。
                兩上肢肩、肘及腕關節中，各有二大關節永久喪失機能者：第 3 級。
                兩上肢肩、肘及腕關節中，各有一大關節永久喪失機能者：第 6 級。
                一上肢肩、肘及腕關節均永久喪失機能者：第 6 級。
                兩上肢肩、肘及腕關節均永久遺存顯著運動障害者：第 4 級。
                兩上肢肩、肘及腕關節中，各有二大關節永久遺存顯著運動障害者：第 5 級。
                兩上肢肩、肘及腕關節均永久遺存運動障害者：第 6 級。
              手指機能障害：
                雙手十指均永久喪失機能者：第 5 級。
              註（上肢機能障害的判定基準）：
              - 「一上肢肩、肘及腕關節永久喪失機能」係指一上肢完全廢用，包括：(1) 一上肢肩、肘及腕關節完全強
                直或完全麻痺，及該手五指均永久喪失機能者；(2) 一上肢肩、肘及腕關節完全強直或完全麻痺者。
              - 「一上肢肩、肘及腕關節永久遺存顯著運動障害」係指一上肢各關節遺存顯著運動障害，包括：(1) 一上肢
                肩、肘及腕關節均永久遺存顯著運動障害，及該手五指均永久喪失機能者；(2) 一上肢肩、肘及腕關節均
                永久遺存顯著運動障害者。
              - 以生理運動範圍作審定關節機能障害之標準：「喪失機能」指關節完全強直或完全麻痺狀態者；「顯著運
                動障害」指喪失生理運動範圍二分之一以上者；「運動障害」指喪失生理運動範圍三分之一以上者。
              - 「手指永久喪失機能」係指：(1) 拇指中手指節關節或指節間關節，喪失生理運動範圍二分之一以上者；
                (2) 其他各指中手指節關節或近位指節間關節，喪失生理運動範圍二分之一以上者；(3) 拇指或其他各指
                之末節切斷達二分之一以上者。
              - 「手指缺失」係指拇指由指節間關節切斷、其他各指由近位指節間關節切斷者；若經接指手術後機能仍永
                久完全喪失者，視為缺失。
              - 機能永久喪失及遺存各級障害之判定，以發生之日起經六個月治療後症狀固定、再治療仍不能期待療效的
                結果為基準判定，但立即可判定者不在此限。

          - key: lower_limb
            article: 附表三（下肢）
            title: 下肢缺損障害、足趾缺損障害、下肢機能障害
            applies_to: ["第十二條", "第十三條", "第十六條", "第十七條", "第二十一條"]
            text: |
              下肢缺損障害：
                兩下肢足踝關節缺失者：第 1 級。
                一下肢髖、膝及足踝關節中，有二大關節以上缺失者：第 5 級。
                一下肢足踝關節缺失者：第 6 級。
              足趾缺損障害：
                雙足十趾均缺失者：第 5 級。
              下肢機能障害：
                兩下肢髖、膝及足踝關節均永久喪失機能者：第 2 級。
                兩下肢髖、膝及足踝關節中，各有二大關節永久喪失機能者：第 3 級。
                兩下肢髖、膝及足踝關節中，各有一大關節永久喪失機能者：第 6 級。
                一下肢髖、膝及足踝關節均永久喪失機能者：第 6 級。
                兩下肢髖、膝及足踝關節均永久遺存顯著運動障害者：第 4 級。
                兩下肢髖、膝及足踝關節中，各有二大關節永久遺存顯著運動障害者：第 5 級。
                兩下肢髖、膝及足踝關節均永久遺存運動障害者：第 6 級。
              註：
              - 「一下肢髖、膝及足踝關節永久喪失機能」係指一下肢完全廢用，包括：(1) 一下肢三大關節均完全強直
                或完全麻痺，以及一足五趾均喪失機能者；(2) 一下肢三大關節均完全強直或完全麻痺者。
              - 「足趾缺失」係指自中足趾關節切斷而足趾全部缺損者。
              - 下肢之機能障害「喪失機能」、「顯著運動障害」或「運動障害」之審定，參照上肢（附表三上肢）之各
                該項規定（生理運動範圍二分之一以上/二分之一以上/三分之一以上）。
              - 若被保險人可證明其另一正常側之肢體關節活動度大於保單條款表定關節活動度時，則依其正常側之肢體
                關節活動度作為生理運動範圍之測定標準。
