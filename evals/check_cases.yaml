# docs/knowledge-distillation-plan.md §4.1 -- labeled eval set for
# llm/exclusion_judge.py::judge_exclusion(), the `check` step of the
# stt_exclusion_notify workflow (demo's primary scenario going forward).
#
# Every transcript/expected answer here was verified by actually running
# judge_exclusion() against the real seeded policy tree
# (data/insurance_product/kgi_ltc.yaml via scripts.seed_insurance_memory),
# not guessed from the filename or from docs/exclusion-scenario-plan.md's
# P4 table alone -- that table's `matched_articles` expectations turned out
# not to hold exactly (see this file's own note below and the plan doc's
# "已驗證發現"), which is why only `involves_exclusion` is a hard field here.
#
# matched_articles, where present, is informational only (evals/run_eval.py
# never fails a case on it) -- verified unstable: the same correct
# involves_exclusion=false judgment sometimes leaves matched_articles empty
# even when the model's own reasoning discussed specific articles.
#
# split: "holdout" (must never regress) vs "regression" (the specific case a
# promoted procedural rule's `evidence` points to as what it fixed --
# docs/knowledge-distillation-plan.md §5 P3 item 1). A "regression" case
# isn't necessarily one that was failing before the rule -- see
# seed-drunk_ride_ltc below, added 2026-08-11: it passed under that historical
# gemini-strong baseline (see docs/knowledge-distillation-plan.md's
# ceiling-effect note). The current workflow declares gemini-cheap, so
# current pass rates must be measured again rather than copied from that run.
# In the historical run,
# promoting its rule couldn't be measured as an *improvement* -- only as
# "didn't regress anything." The label just means "this is what the active
# rule's evidence points to, guard it going forward," not "this was broken
# and now isn't."

- id: self_harm
  # docs/exclusion-scenario-plan.md P4's "明確除外" case. No audio sample
  # exists for this one -- the original gen_policy_01.wav content (before
  # cf6b141 replaced it with the drunk_driving_bike transcript above) was
  # this scenario, but only the transcript survived into that doc's P4
  # table, not the audio file itself.
  transcript: "我那時候是想不開自己弄的，現在人躺著要人照顧"
  expected:
    involves_exclusion: true
  split: holdout

- id: seed-drunk_ride_ltc
  # evidence for default/procedural/stt_exclusion_notify/check's
  # pending-e9b8205f... rule (approved 2026-08-11): same 酒駕 nuance as
  # drunk_driving_bike above (excluded from the 意外二至三級失能 benefit
  # under 第二十九條, but the customer here is asking about 長期照顧, which
  # only 第二十七條 governs and 第二十七條 doesn't list 酒駕) -- deliberately
  # different transcript/scenario from drunk_driving_bike so this eval case
  # isn't also sitting in the episodic few-shot corpus verbatim (see
  # scripts/seed_exclusion_episodic_examples.py's header on why that
  # contaminates measurement). Verified via real judge_exclusion() 3/3
  # stable before being seeded as episodic content.
  transcript: "我朋友他去年喝酒之後騎機車摔倒，頸椎受傷，現在生活起居都要人照顧，這張保單的長期照顧保險金賠不賠"
  expected:
    involves_exclusion: false
  split: regression

