# docs/knowledge-distillation-plan.md §4.1 -- labeled eval set for
# llm/exclusion_judge.py::judge_exclusion(), the `check` step of the
# stt_exclusion_notify workflow (demo's primary scenario going forward).
#
# Every transcript/expected answer here was verified by actually running
# judge_exclusion() against the real seeded policy tree
# (data/insurance_product/kgi_ltc.yaml via scripts.seed_insurance_memory),
# not guessed from the filename or from docs/exclusion-scenario-plan.md's
# P4 table alone -- that table's `matched_articles` expectations turned out
# not to hold exactly (see this file's own note below and the plan doc's
# "已驗證發現"), which is why only `involves_exclusion` is a hard field here.
#
# matched_articles, where present, is informational only (evals/run_eval.py
# never fails a case on it) -- verified unstable: the same correct
# involves_exclusion=false judgment sometimes leaves matched_articles empty
# even when the model's own reasoning discussed specific articles.
#
# split: "holdout" (must never regress) vs "regression" (the specific case a
# promoted procedural rule's `evidence` points to as what it fixed --
# docs/knowledge-distillation-plan.md §5 P3 item 1). A "regression" case
# isn't necessarily one that was failing before the rule -- see
# seed-drunk_ride_ltc below, added 2026-08-11: it already passed at baseline
# (MODEL_NAME is gemini-strong, which clears every case here on its own,
# see docs/knowledge-distillation-plan.md's ceiling-effect note), so
# promoting its rule couldn't be measured as an *improvement* -- only as
# "didn't regress anything." The label just means "this is what the active
# rule's evidence points to, guard it going forward," not "this was broken
# and now isn't."

- id: drunk_driving_bike
  # Corresponds to samples/gen_policy_01.wav's actual current content
  # (regenerated by commit cf6b141). docs/exclusion-scenario-plan.md P4's
  # main test case: the naive answer ("drunk driving -> excluded") is
  # wrong -- the exclusion clause only excludes the accident-disability
  # benefit (articles 16/17), and this customer's disability level (grade
  # 6, looked up from the appendix) never reaches that benefit's own
  # threshold (grade 2-3) in the first place, so it's not an exclusion
  # case at all -- the claim just doesn't qualify on its own terms.
  transcript: "我上個月喝了點酒騎腳踏車回家撞了現在右手肩膀手肘手腕都動不了了醫生說好不了我這張長照顯賠不賠"
  expected:
    involves_exclusion: false
  split: holdout

- id: unrelated_ltc_criteria
  # Corresponds to samples/gen_policy_02.wav. A question with no bearing on
  # exclusions at all -- tests that the citation-verification guard doesn't
  # hallucinate an article just because *some* tool call happened.
  transcript: "長期照顧狀態到底怎麼認定要準備什麼文件"
  expected:
    involves_exclusion: false
    matched_articles: []
  split: holdout

- id: self_harm
  # docs/exclusion-scenario-plan.md P4's "明確除外" case. No audio sample
  # exists for this one -- the original gen_policy_01.wav content (before
  # cf6b141 replaced it with the drunk_driving_bike transcript above) was
  # this scenario, but only the transcript survived into that doc's P4
  # table, not the audio file itself.
  transcript: "我那時候是想不開自己弄的，現在人躺著要人照顧"
  expected:
    involves_exclusion: true
  split: holdout

- id: seed-drunk_ride_ltc
  # evidence for default/procedural/stt_exclusion_notify/check's
  # pending-e9b8205f... rule (approved 2026-08-11): same 酒駕 nuance as
  # drunk_driving_bike above (excluded from the 意外二至三級失能 benefit
  # under 第二十九條, but the customer here is asking about 長期照顧, which
  # only 第二十七條 governs and 第二十七條 doesn't list 酒駕) -- deliberately
  # different transcript/scenario from drunk_driving_bike so this eval case
  # isn't also sitting in the episodic few-shot corpus verbatim (see
  # scripts/seed_exclusion_episodic_examples.py's header on why that
  # contaminates measurement). Verified via real judge_exclusion() 3/3
  # stable before being seeded as episodic content.
  transcript: "我朋友他去年喝酒之後騎機車摔倒，頸椎受傷，現在生活起居都要人照顧，這張保單的長期照顧保險金賠不賠"
  expected:
    involves_exclusion: false
  split: regression

- id: policyholder_brother_disability23
  # docs/exclusion-actor-distinction-demo.md §2.1's holdout transcript --
  # same 要保人/被保險人 actor-distinction logic as the two seed-
  # policyholder_* regression cases below (要保人's intentional act doesn't
  # exclude the 意外二至三級失能 benefit), but this exact wording was
  # deliberately never put into episodic memory -- it's the control that
  # proves the *procedural* rule generalizes past the two cases it was
  # distilled from, not just memorized them verbatim.
  transcript: "這張保單要保人是我哥哥，被保險人是我，前陣子他因為欠錢的事情跟我起爭執動手推我，我摔下樓梯導致下肢神經受損被評估到第二級失能，這個意外二至三級失能保險金賠不賠"
  expected:
    involves_exclusion: false
  split: holdout

- id: seed-policyholder_assault_disability23
  # evidence for default/procedural/stt_exclusion_notify/check's
  # pending-f87a9151... rule (approved 2026-08-12, docs/exclusion-actor-
  # distinction-demo.md): the 要保人/被保險人 actor-distinction blind spot --
  # 第二十九條 excludes the 意外二至三級失能 benefit for the insured's own
  # ("被保險人本人") intentional act, but its trailing proviso saves the
  # claim when the intentional act was the *policyholder's* ("要保人")
  # instead. gemini-cheap evidence diagnostic at approval time (--repeats 3,
  # --model gemini-cheap): baseline [True, True, True] (misjudged every
  # run) -> candidate [False, False, False] (correct every run) -- the
  # cleanest before/after contrast of the two evidence cases, so this one
  # (not seed-policyholder_family_assault_disability3, which already passed
  # 2/3 at baseline) is the regression guard.
  transcript: "我朋友的保單要保人是他先生，被保險人是他自己，去年他先生跟他吵架失控打傷他的背，害他脊椎受損被鑑定到第二級失能，這張保單的意外二至三級失能保險金賠不賠"
  expected:
    involves_exclusion: false
  split: regression
