name: CI

on:
  push:
  pull_request:

jobs:
  gather-concurrency-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run python gather_concurrency_smoke_test.py
