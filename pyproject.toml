[project]
name = "multi-agent-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.20.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "librosa>=0.11.0",
    "litellm[proxy]==1.92.2",
    "mcp>=1.0.0",
    "openai>=1.50.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.0",
    "ruamel-yaml>=0.19.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.14.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
